[project]
name = "lab-report-assistant"
version = "0.1.0"
description = "实验报告助手 API"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.100.0",
  "pydantic>=2.0.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.10.0",
  "uvicorn>=0.20.0",
  "python-docx>=1.0.0",
  "python-pptx>=1.0.2",
  "python-multipart>=0.0.5",
  "httpx>=0.24.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "pypdf>=4.0.0",
  "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "httpx>=0.24.0",
  "httpx2>=2.0.0",
]
# 科学计算包（TD-004 已清理，SPEC 0016）：应用代码不直接导入，由用户代码通过 python_executor 运行时调用
# 安装方式：pip install -e ".[analysis]" 或 pip install -e ".[dev,analysis]"
# 版本下限与 server/Dockerfile 第 23-29 行固定版本一致（避免引入新版本兼容风险）
analysis = [
  "pandas>=3.0.3",
  "numpy>=2.5.1",
  "scipy>=1.18.0",
  "scikit-learn>=1.9.0",
  "matplotlib>=3.11.0",
  "psutil>=7.2.2",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "data*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
